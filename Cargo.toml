[package]
name = "exynos-loke-rescue"
version = "0.2.0"
edition = "2021"
authors = ["Rabeeh Fouz Ahammad VK"]
description = "Deterministic Linux recovery and partition orchestration engine for Samsung Exynos devices."
license = "MIT"
repository = "https://github.com/rebeeh/exynos-loke-rescue"
keywords = ["samsung", "exynos", "odin", "loke", "unbrick", "samloader"]
categories = ["command-line-utilities", "os::linux-apis"]

[dependencies]
anyhow = "1.0"
byteorder = "1.5"
clap = { version = "4.5", features = ["derive", "env"] }
colored = "2.1"
indicatif = "0.17"
lz4_flex = "0.11"
regex = "1.10"
sha2 = "0.10"
tar = "0.4"
tempfile = "3.10"
thiserror = "1.0"
which = "6.0"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
