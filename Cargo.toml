[package]
name = "exynos-loke-rescue"
version = "1.0.0"
edition = "2021"
authors = ["Rabeeh Fouz Ahammad VK"]
description = "Native Linux LOKE protocol driver and deterministic firmware recovery engine for Samsung Exynos devices."
license = "MIT"
repository = "https://github.com/rebeeh/exynos-loke-rescue"
readme = "README.md"
keywords = ["samsung", "exynos", "odin", "loke", "unbrick", "nusb"]
categories = ["command-line-utilities", "os::linux-apis", "hardware-support"]

[dependencies]
anyhow = "1.0"
byteorder = "1.5"
clap = { version = "4.5", features = ["derive", "env"] }
colored = "2.1"
console = "0.15"
futures-lite = "2.3"
futures-timer = "3.0"
indicatif = "0.17"
lz4_flex = "0.11"
md5 = "0.8.1"
nusb = "0.1"
tar = "0.4"
tempfile = "3.10"
thiserror = "1.0"
which = "6.0"

[build-dependencies]
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
clap_mangen = "0.2"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
