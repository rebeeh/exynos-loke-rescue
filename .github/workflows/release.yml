name: Release Engineering & Artifact Distribution

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-matrix:
    name: Build & Package (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            use_cross: false
          - target: x86_64-unknown-linux-musl
            use_cross: true
          - target: aarch64-unknown-linux-gnu
            use_cross: true
          - target: aarch64-unknown-linux-musl
            use_cross: true
          - target: armv7-unknown-linux-gnueabihf
            use_cross: true

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Cross-Compilation Tools
        if: matrix.use_cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build Target Release Binary
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }}
            mkdir -p target/release
            cp target/${{ matrix.target }}/release/exynos-loke-rescue target/release/
          else
            cargo build --release --target ${{ matrix.target }}
          fi

      - name: Verify Binary Hardening & Sanitization
        run: ./scripts/audit_release.sh target/release/exynos-loke-rescue

      - name: Assemble Release Tarball
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ./scripts/package_tarball.sh "${VERSION}" "${{ matrix.target }}"

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: dist/*

  package-deb-rpm:
    name: Package Debian (.deb) & Red Hat (.rpm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Install Packaging Utilities
        run: |
          cargo install cargo-deb
          cargo install cargo-generate-rpm

      - name: Build Release Binary
        run: cargo build --release

      - name: Generate Debian Package (.deb)
        run: |
          mkdir -p dist
          cargo deb -o dist/

      - name: Generate RPM Package (.rpm)
        run: |
          cargo generate-rpm -o dist/

      - name: Upload System Packages
        uses: actions/upload-artifact@v4
        with:
          name: system-packages
          path: dist/*

  publish-release:
    name: Publish GitHub Release & Signatures
    needs: [build-matrix, package-deb-rpm]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download All Release Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Compute Checksums & Provenance
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS
          sha512sum * > SHA512SUMS
          cat SHA256SUMS

      - name: Attest Build Provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "release-assets/*"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
          draft: false
          prerelease: false
