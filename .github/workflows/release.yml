name: Release Engineering & Artifact Distribution

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-matrix:
    name: Build & Package (linux-${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: x86_64
            target: x86_64-unknown-linux-musl
            use_cross: false
          - arch: aarch64
            target: aarch64-unknown-linux-musl
            use_cross: true

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Host Musl Tools
        if: matrix.use_cross == false
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Install Cross-Compilation Tools
        if: matrix.use_cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build Target Release Binary (Static Musl)
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi

      - name: Verify Binary Hardening & Exposure Audit
        run: ./scripts/audit_release.sh "target/${{ matrix.target }}/release/exynos-loke-rescue"

      - name: Assemble Release Assets (.zip and .tar.gz)
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ./scripts/package_release.sh "${VERSION}" "${{ matrix.arch }}" "${{ matrix.target }}"

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.arch }}
          path: dist/*

  publish-release:
    name: Publish GitHub Release & Signatures
    needs: [build-matrix]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download All Release Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Compute Checksums & Provenance
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS
          sha512sum * > SHA512SUMS
          cat SHA256SUMS

      - name: Attest Build Provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "release-assets/*"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
          draft: false
          prerelease: false
